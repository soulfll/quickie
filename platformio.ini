; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Two board revisions share everything below. Plain `pio run -t upload`
; builds/flashes the original v3 board (teensy40) only. For the new PCB:
;   pio run -e teensy40_v4 -t upload
[platformio]
default_envs = teensy40

[env]
platform = teensy
board = teensy40
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200

; USB_SERIAL_HID = Serial (debug prints) + Keyboard + Mouse + Joystick.
; Keeps Serial.print debugging alive alongside the HID keyboard reports.
build_flags = -D USB_SERIAL_HID

lib_deps =
    fastled/FastLED@^3.7.0
    olikraus/U8g2@^2.36.0

[env:teensy40]
; Original v3 PCB (hardware/new project v.3 new layout.kicad_pcb).

[env:teensy40_v4]
; New PCB (teensytesttrey schematic): keys moved to pins 0-7. See keys.cpp.
build_flags =
    ${env.build_flags}
    -D BOARD_V4
